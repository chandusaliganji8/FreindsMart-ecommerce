<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Checkout</title>
    <link rel="stylesheet" href="/frontend/css/styles.css" />
  </head>
  <body>
    <header>
      <nav class="nav">
        <a class="logo" href="/frontend/index.html">FriendSmart</a>
        <div class="nav-links" id="authLinks"></div>
      </nav>
    </header>

    <main class="container">
      <h1>Checkout</h1>
      <div id="status"></div>
      <form id="checkoutForm">
        <input type="text" name="fullName" placeholder="Full Name" required />
        <input type="text" name="phone" placeholder="Phone Number" required />
        <textarea name="addressLine" placeholder="Street Address" required></textarea>
        <div class="row">
          <input type="text" name="city" placeholder="City" required />
          <input type="text" name="state" placeholder="State" required />
        </div>
        <input type="text" name="pincode" placeholder="Pincode" required />
        <button type="submit">Place Order</button>
      </form>
    </main>

    <script src="/frontend/js/api.js"></script>
    <script src="/frontend/js/common.js"></script>
    <script>
      const statusBox = document.getElementById('status');
      const form = document.getElementById('checkoutForm');

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        const shippingAddress = Object.fromEntries(new FormData(form).entries());

        try {
          await apiFetch('/orders', {
            method: 'POST',
            body: JSON.stringify({ shippingAddress }),
          });
          showMessage(statusBox, 'Order placed successfully!');
          form.reset();
          setTimeout(() => (window.location.href = '/frontend/pages/orders.html'), 900);
        } catch (error) {
          showMessage(statusBox, error.message, 'error');
        }
      });
    </script>
  </body>
</html>
