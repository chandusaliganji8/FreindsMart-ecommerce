<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Register</title>
    <link rel="stylesheet" href="/frontend/css/styles.css" />
  </head>
  <body>
    <header>
      <nav class="nav">
        <a class="logo" href="/frontend/index.html">FriendSmart</a>
        <div class="nav-links" id="authLinks"></div>
      </nav>
    </header>

    <main class="container">
      <h1>Create Account</h1>
      <div id="status"></div>
      <form id="registerForm">
        <input type="text" name="name" placeholder="Full Name" required />
        <input type="email" name="email" placeholder="Email" required />
        <input type="password" name="password" placeholder="Password (min 6 chars)" minlength="6" required />
        <button type="submit">Register</button>
      </form>
    </main>

    <script src="/frontend/js/api.js"></script>
    <script src="/frontend/js/common.js"></script>
    <script>
      const statusBox = document.getElementById('status');
      const form = document.getElementById('registerForm');

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        const formData = new FormData(form);
        const payload = Object.fromEntries(formData.entries());

        try {
          const data = await apiFetch('/auth/signup', {
            method: 'POST',
            body: JSON.stringify(payload),
          });
          localStorage.setItem('token', data.token);
          localStorage.setItem('user', JSON.stringify(data.user));
          showMessage(statusBox, 'Registration successful. Redirecting...');
          setTimeout(() => (window.location.href = '/frontend/index.html'), 800);
        } catch (error) {
          showMessage(statusBox, error.message, 'error');
        }
      });
    </script>
  </body>
</html>
