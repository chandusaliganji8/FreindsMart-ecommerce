<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin Panel</title>
    <link rel="stylesheet" href="/frontend/css/styles.css" />
  </head>
  <body>
    <header>
      <nav class="nav">
        <a class="logo" href="/frontend/index.html">FriendSmart</a>
        <div class="nav-links" id="authLinks"></div>
      </nav>
    </header>

    <main class="container">
      <h1>Admin Product Management</h1>
      <div id="status"></div>

      <form id="productForm">
        <input type="hidden" name="id" />
        <input type="text" name="name" placeholder="Product Name" required />
        <textarea name="description" placeholder="Description" required></textarea>
        <div class="row">
          <input type="number" name="price" step="0.01" placeholder="Price" required />
          <input type="number" name="stock" placeholder="Stock" required />
        </div>
        <div class="row">
          <input type="text" name="brand" placeholder="Brand" />
          <input type="text" name="category" placeholder="Category" />
        </div>
        <input type="url" name="imageUrl" placeholder="Image URL" />
        <button type="submit">Save Product</button>
      </form>

      <h2>Existing Products</h2>
      <div id="products"></div>
    </main>

    <script src="/frontend/js/api.js"></script>
    <script src="/frontend/js/common.js"></script>
    <script>
      const user = JSON.parse(localStorage.getItem('user') || 'null');
      if (!user || user.role !== 'admin') {
        alert('Admin access required');
        window.location.href = '/frontend/pages/login.html';
      }

      const statusBox = document.getElementById('status');
      const form = document.getElementById('productForm');
      const productsBox = document.getElementById('products');

      const loadProducts = async () => {
        try {
          const products = await apiFetch('/products');
          productsBox.innerHTML = `
            <table class="table">
              <thead>
                <tr><th>Name</th><th>Price</th><th>Stock</th><th>Actions</th></tr>
              </thead>
              <tbody>
                ${products
                  .map(
                    (p) => `
                      <tr>
                        <td>${p.name}</td>
                        <td>₹${p.price}</td>
                        <td>${p.stock}</td>
                        <td>
                          <button class="secondary" onclick='editProduct(${JSON.stringify(p)})'>Edit</button>
                          <button class="danger" onclick="deleteProduct('${p._id}')">Delete</button>
                        </td>
                      </tr>
                    `
                  )
                  .join('')}
              </tbody>
            </table>
          `;
        } catch (error) {
          showMessage(statusBox, error.message, 'error');
        }
      };

      const editProduct = (product) => {
        for (const key in product) {
          if (form.elements[key]) {
            form.elements[key].value = product[key] ?? '';
          }
        }
        form.elements.id.value = product._id;
      };

      const deleteProduct = async (id) => {
        if (!confirm('Are you sure?')) return;
        try {
          await apiFetch(`/products/${id}`, { method: 'DELETE' });
          showMessage(statusBox, 'Product deleted');
          loadProducts();
        } catch (error) {
          showMessage(statusBox, error.message, 'error');
        }
      };

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        const payload = Object.fromEntries(new FormData(form).entries());
        const id = payload.id;
        delete payload.id;

        payload.price = Number(payload.price);
        payload.stock = Number(payload.stock);

        try {
          if (id) {
            await apiFetch(`/products/${id}`, {
              method: 'PUT',
              body: JSON.stringify(payload),
            });
            showMessage(statusBox, 'Product updated');
          } else {
            await apiFetch('/products', {
              method: 'POST',
              body: JSON.stringify(payload),
            });
            showMessage(statusBox, 'Product created');
          }
          form.reset();
          loadProducts();
        } catch (error) {
          showMessage(statusBox, error.message, 'error');
        }
      });

      loadProducts();
      window.editProduct = editProduct;
      window.deleteProduct = deleteProduct;
    </script>
  </body>
</html>
