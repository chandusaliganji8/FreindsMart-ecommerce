<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FriendsMart - Admin Panel</title>
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <nav class="navbar">
      <h1>FriendsMart Admin</h1>
      <div class="nav-links">
        <a href="index.html">Store</a>
      </div>
    </nav>

    <main class="container">
      <h2>Manage Products</h2>
      <div id="adminAlert"></div>

      <form id="adminForm" class="form">
        <div class="form-group">
          <label for="name">Product Name</label>
          <input id="name" required />
        </div>
        <div class="form-group">
          <label for="description">Description</label>
          <textarea id="description" rows="3" required></textarea>
        </div>
        <div class="form-group">
          <label for="price">Price</label>
          <input id="price" type="number" required />
        </div>
        <div class="form-group">
          <label for="category">Category</label>
          <input id="category" />
        </div>
        <div class="form-group">
          <label for="stock">Stock</label>
          <input id="stock" type="number" required />
        </div>
        <div class="form-group">
          <label for="imageUrl">Image URL</label>
          <input id="imageUrl" />
        </div>

        <button class="btn" type="submit">Add Product</button>
      </form>

      <h3 style="margin-top: 16px">Existing Products</h3>
      <section id="adminProducts" class="grid"></section>
    </main>

    <script src="js/config.js"></script>
    <script src="js/admin.js"></script>
  </body>
</html>
